# Publie une Release GitHub avec le pack CutFX-<version>-installation.zip
# à chaque tag « v… » (ex. v1.1.0). Le pack n'est publié que si les tests passent.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Fabriquer le pack d'installation
        id: package
        run: |
          npm run -s package
          VERSION=$(node -p "require('./package.json').version")
          unzip -l "dist/CutFX-$VERSION-installation.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=dist/CutFX-$VERSION-installation.zip" >> "$GITHUB_OUTPUT"

      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.package.outputs.version }}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version (v${{ steps.package.outputs.version }})."
            exit 1
          fi

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          TAG="v$VERSION"
          NOTES=$(cat <<'EOF'
          ## Installer CutFX

          1. Télécharge **CutFX-VERSION-installation.zip** ci-dessous (section *Assets*) et décompresse-le.
          2. Ferme Premiere Pro, puis :
             - Windows : double-clique sur *Installer CutFX (Windows).bat* (si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* > *Exécuter quand même*) ;
             - Mac : clic droit sur *Installer CutFX (Mac).command* > *Ouvrir*.
          3. Dans Premiere Pro : *Fenêtre > Extensions > CutFX*.

          Pour mettre à jour : relance le script de la nouvelle version, tes effets perso sont gardés.

          Plugin gratuit par [@robin.rahoual](https://www.instagram.com/robin.rahoual/) sur Instagram.
          EOF
          )
          NOTES="${NOTES//VERSION/$VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "CutFX $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
