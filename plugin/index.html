<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RR FX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-dark">
  <div class="panel" id="panel">
    <div class="header">
      <!-- Crédit toujours visible, même quand le panneau est tout petit. -->
      <div class="brand">
        <button class="action quiet" id="instagram" title="Ouvrir le profil Instagram de @robin.rahoual">
          <span class="ig-icon"><svg viewBox="0 0 24 24" width="14" height="14">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" ry="5.5" fill="none" stroke="currentColor" stroke-width="2"></rect>
            <circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <circle cx="17.6" cy="6.4" r="1.3" fill="currentColor"></circle>
          </svg></span>
          @robin.rahoual sur Instagram
        </button>
        <button class="action quiet" id="open-palette" title="Rechercher une action, un effet, un look… (Ctrl+K ou /)">🔍</button>
        <button class="action quiet" id="toggle-compact">▴ Réduire</button>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab tab-express" data-tab="express" title="Ton montage en un clic : clip, Reels, entreprise, événement, YouTube">⚡ Express</button>
        <button class="tab" data-tab="effects" title="Transitions et effets sur les coupes, marqueurs et temps forts">Effets</button>
        <button class="tab" data-tab="ramp" title="Rampes de vitesse">Rampe</button>
        <button class="tab" data-tab="color" title="Conversion LOG, expo auto, raccord, looks façon Lightroom">Couleur</button>
        <button class="tab" data-tab="music" title="Temps forts, montage auto, synchro, multicam">Musique</button>
        <button class="tab" data-tab="titles" title="Titres et paroles animés">Textes</button>
        <button class="tab" data-tab="speech" title="YouTube, interviews, vidéos d&#39;entreprise : silences, jump cuts, sous-titres, bandeaux">Parole</button>
        <button class="tab" data-tab="formats" title="Copie 9:16, 4:5, 1:1 pour les réseaux">Formats</button>
        <button class="tab" data-tab="assets" title="Tes dossiers d&#39;effets, sons, LUTs, polices">Ressources</button>
        <button class="tab" data-tab="mine" title="Effets perso, packs de style, communauté">Mes effets</button>
        <button class="tab" data-tab="settings" title="Réglages">⚙</button>
      </nav>
      <button class="cta" id="cta">Appliquer</button>
      <div id="status" class="status idle">
        <div class="status-top">
          <span id="status-icon" class="status-icon"></span>
          <span id="status-title" class="status-title">Prêt</span>
          <button class="action quiet" id="undo" disabled>↶ Annuler</button>
          <button class="action quiet icon" id="history" title="Historique des opérations RR FX" aria-label="Historique des opérations RR FX">🕘</button>
          <button class="action quiet hidden" id="cancel">Arrêter</button>
          <button class="action quiet hidden" id="status-close" title="Fermer">✕</button>
        </div>
        <div class="progress hidden" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="status-detail muted" id="status-detail">Ouvre une séquence dans Premiere.</div>
        <button class="action quiet hidden" id="status-log">Voir le détail</button>
      </div>
      <div id="update-banner" class="status update hidden">
        <div class="status-detail" id="update-text"></div>
        <div class="row-buttons">
          <button class="action" id="update-download">Télécharger</button>
          <button class="action quiet" id="update-page">Nouveautés</button>
          <button class="action quiet" id="update-later">Plus tard</button>
        </div>
      </div>
    </div>

    <!-- Barre de défilement toujours affichée : on voit qu'il y a des réglages en dessous. -->
    <div class="scroll" id="scroll">
      <section class="view" id="view-express"></section>
      <section class="view" id="view-effects"></section>
      <section class="view" id="view-ramp"></section>
      <section class="view" id="view-color"></section>
      <section class="view" id="view-music"></section>
      <section class="view" id="view-titles"></section>
      <section class="view" id="view-speech"></section>
      <section class="view" id="view-formats"></section>
      <section class="view" id="view-assets"></section>
      <section class="view" id="view-mine"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </div>
  <div id="modal-root"></div>
